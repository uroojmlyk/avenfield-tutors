<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FFFDF7"/>
  <circle cx="1120" cy="120" r="200" fill="#3A9E8F" opacity="0.18"/>
  <circle cx="60" cy="540" r="150" fill="#E05C42" opacity="0.14"/>

  <!-- staircase -->
  <g stroke="#2E4F5E" stroke-width="8" stroke-linejoin="round">
    <rect x="230" y="450" width="150" height="90" fill="#E8C86A"/>
    <rect x="380" y="380" width="150" height="160" fill="#E8934A"/>
    <rect x="530" y="310" width="150" height="230" fill="#3A9E8F"/>
    <rect x="680" y="230" width="150" height="310" fill="#E05C42"/>
  </g>

  <!-- labels on steps -->
  <text x="305" y="500" font-family="Nunito, sans-serif" font-weight="900" font-size="20" fill="#2E4F5E" text-anchor="middle">O1</text>
  <text x="455" y="465" font-family="Nunito, sans-serif" font-weight="900" font-size="20" fill="#2E4F5E" text-anchor="middle">O2</text>
  <text x="605" y="390" font-family="Nunito, sans-serif" font-weight="900" font-size="20" fill="#FFFDF7" text-anchor="middle">AS</text>
  <text x="755" y="300" font-family="Nunito, sans-serif" font-weight="900" font-size="20" fill="#FFFDF7" text-anchor="middle">A2</text>

  <!-- graduation cap at the top -->
  <g transform="translate(755,175)">
    <path d="M -80 0 L 0 -34 L 80 0 L 0 34 Z" fill="#2E4F5E" stroke="#2E4F5E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="75" cy="16" r="6" fill="#E8C86A"/>
    <line x1="75" y1="16" x2="75" y2="55" stroke="#E8C86A" stroke-width="5"/>
  </g>

  <!-- upward arrow -->
  <g transform="translate(950,400)" stroke="#2E4F5E" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M -60 90 C -20 20 20 -30 70 -90"/>
    <path d="M 30 -95 L 70 -90 L 62 -50"/>
  </g>
</svg>
