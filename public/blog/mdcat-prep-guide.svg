<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FFFDF7"/>
  <circle cx="1100" cy="500" r="220" fill="#E05C42" opacity="0.14"/>
  <circle cx="80" cy="100" r="170" fill="#3A9E8F" opacity="0.18"/>

  <!-- medical cross badge -->
  <g transform="translate(430,300)">
    <circle r="140" fill="#FFFDF7" stroke="#2E4F5E" stroke-width="10"/>
    <rect x="-24" y="-90" width="48" height="180" rx="10" fill="#E05C42"/>
    <rect x="-90" y="-24" width="180" height="48" rx="10" fill="#E05C42"/>
  </g>

  <!-- stethoscope -->
  <g transform="translate(830,320)" fill="none" stroke="#2E4F5E" stroke-width="10" stroke-linecap="round">
    <path d="M -120 -140 C -120 -60 -60 -40 -20 -40 C 20 -40 60 -70 60 -130" />
    <circle cx="-120" cy="-160" r="16" fill="#3A9E8F" stroke="#2E4F5E" stroke-width="8"/>
    <circle cx="60" cy="-150" r="16" fill="#3A9E8F" stroke="#2E4F5E" stroke-width="8"/>
    <path d="M -20 -40 C -20 20 -20 60 30 80" />
    <circle cx="55" cy="95" r="34" fill="#E8C86A" stroke="#2E4F5E" stroke-width="9"/>
  </g>

  <!-- book base -->
  <g transform="translate(600,530)">
    <rect x="-260" y="-20" width="520" height="60" rx="10" fill="#3A9E8F" stroke="#2E4F5E" stroke-width="8"/>
    <rect x="-260" y="-20" width="520" height="18" fill="#2E4F5E"/>
  </g>

  <!-- small pill/capsule icon -->
  <g transform="translate(250,470) rotate(35)">
    <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#E8934A" stroke="#2E4F5E" stroke-width="7"/>
    <path d="M 0 -20 L 0 20" stroke="#2E4F5E" stroke-width="7"/>
  </g>
</svg>
