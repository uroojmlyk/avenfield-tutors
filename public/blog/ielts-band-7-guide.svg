    <ellipse cx="0" cy="0" rx="60" ry="150" fill="none" stroke="#FFFDF7" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="130" ry="150" fill="none" stroke="#FFFDF7" stroke-width="5" opacity="0.5"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#FFFDF7" stroke-width="5"/>
    <line x1="-140" y1="-70" x2="140" y2="-70" stroke="#FFFDF7" stroke-width="5"/>
    <line x1="-140" y1="70" x2="140" y2="70" stroke="#FFFDF7" stroke-width="5"/>
  </g>

  <!-- speech bubble with target -->
  <g transform="translate(830,270)">
    <path d="M -170 -110 h340 a30 30 0 0 1 30 30 v150 a30 30 0 0 1 -30 30 h-230 l -60 60 v-60 h-50 a30 30 0 0 1 -30 -30 v-150 a30 30 0 0 1 30 -30 z"
