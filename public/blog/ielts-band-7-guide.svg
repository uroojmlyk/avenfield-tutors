    <circle cx="0" cy="-5" r="70" fill="#E05C42" stroke="#2E4F5E" stroke-width="7"/>
    <circle cx="0" cy="-5" r="46" fill="#FFFDF7" stroke="#2E4F5E" stroke-width="6"/>
    <circle cx="0" cy="-5" r="20" fill="#E8C86A" stroke="#2E4F5E" stroke-width="6"/>
  </g>

